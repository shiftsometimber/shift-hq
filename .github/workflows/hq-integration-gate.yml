name: Shift HQ Integration Gate
on:
  pull_request:
    paths:
      - 'hq.js'
      - 'radar-source-review-ui.test.mjs'
      - 'radar-source-review-logic.test.mjs'
      - 'hq-v111.js'
      - 'hq.css'
      - 'hq-knowledge-editorial.css'
      - 'index.html'
      - '.github/workflows/hq-integration-gate.yml'
jobs:
  hq-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check HQ runtimes
        run: |
          node --check hq.js
          node --check hq-v111.js
      - name: Protect V1.11 runtime and Radar shell wiring
        run: |
          # Reviewed HQ management baseline: role-aware CRM startup plus login guards, commerce
          # cards, Timber Mill catalogue and genuine Stripe refund-email controls.
          # Preserve the 6 Sep Turnstile login/bootstrap protection (bcb1ffe8).
          test "$(git hash-object hq-v111.js)" = "082a1bf557cf8ec57279db9b155a4a7fc5010b42"
          grep -q "installRadarView" hq.js
          grep -q "rationaliseKnowledgeNavigation" hq.js
          grep -q "/v1/hq/radar/queue" hq.js
          grep -q "/v1/hq/radar/publication-jobs" hq.js
          test ! -f radar.html
      - name: G3-006 Knowledge editorial presentation contract
        run: |
          grep -q "knowledge-editorial-intro" hq.js
          grep -q "reviewer_name" hq.js
          grep -q "data-knowledge-review" hq.js
          grep -q "/v1/hq/articles/.*/publish" hq.js
          grep -q "hq-knowledge-editorial.css?v=2" hq.js
          grep -q "#253128" hq-knowledge-editorial.css
          grep -q "#f7f3e8" hq-knowledge-editorial.css
          grep -q "@media(max-width:900px)" hq-knowledge-editorial.css
          grep -q "prefers-reduced-motion" hq-knowledge-editorial.css
      - name: Verify source correction logic and existing evidence boundary
        run: |
          node --test radar-source-review-logic.test.mjs
          node evidence-desk-ui-source-gate.mjs
      - name: Install Chromium for isolated Radar UI fixtures
        run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: Verify source correction with fictional local fixtures
        run: node radar-source-review-ui.test.mjs
      - name: Retain Radar UI fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-source-review-evidence
          path: radar-source-review-evidence
          if-no-files-found: warn
          retention-days: 30
