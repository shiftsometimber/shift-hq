name: Shift HQ Integration Gate
on:
  pull_request:
    paths:
      - 'hq.js'
      - 'hq-v111.js'
      - 'hq.css'
      - 'hq-knowledge-editorial.css'
      - 'index.html'
      - '.github/workflows/hq-integration-gate.yml'
jobs:
  hq-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check HQ runtimes
        run: |
          node --check hq.js
          node --check hq-v111.js
      - name: Protect V1.11 runtime and Radar shell wiring
        run: |
          test "$(git hash-object hq-v111.js)" = "bdecd2e4fcc49cf4e6a8bdf39f99aedfe83d24c4"
          grep -q "installRadarView" hq.js
          grep -q "rationaliseKnowledgeNavigation" hq.js
          grep -q "/v1/hq/radar/queue" hq.js
          grep -q "/v1/hq/radar/publication-jobs" hq.js
          test ! -f radar.html
      - name: G3-006 Knowledge editorial presentation contract
        run: |
          grep -q "knowledge-editorial-intro" hq.js
          grep -q "reviewer_name" hq.js
          grep -q "data-knowledge-review" hq.js
          grep -q "/v1/hq/articles/.*/publish" hq.js
          grep -q "hq-knowledge-editorial.css?v=1" hq.js
          grep -q "#253128" hq-knowledge-editorial.css
          grep -q "#f7f3e8" hq-knowledge-editorial.css
          grep -q "@media(max-width:900px)" hq-knowledge-editorial.css
          grep -q "prefers-reduced-motion" hq-knowledge-editorial.css
