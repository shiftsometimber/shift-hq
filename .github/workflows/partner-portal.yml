name: Partner portal isolation
on:
  push:
    paths: ['partner-portal/**', '.github/workflows/partner-portal.yml']
  pull_request:
    paths: ['partner-portal/**', '.github/workflows/partner-portal.yml']
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test partner-portal/test/*.test.mjs
