name: G3-006 CSS Cache Bust
on:
  push:
    branches: ['commissioning/g3-006-css-cache-bust']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: commissioning/g3-006-css-cache-bust
      - name: Bump governed Knowledge stylesheet version only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('hq.js')
          s=p.read_text()
          old="hq-knowledge-editorial.css?v=1"
          new="hq-knowledge-editorial.css?v=2"
          if new in s:
              raise SystemExit(0)
          if old not in s:
              raise SystemExit('Knowledge stylesheet version marker missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit bounded cache bust
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hq.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'G3-006: serve responsive Knowledge CSS v2'
          git push origin HEAD:commissioning/g3-006-css-cache-bust
